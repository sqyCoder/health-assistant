spring:
  application:
    name: health-assistant
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/health}
    username: ${SUPABASE_DB_USER:health}
    password: ${SUPABASE_DB_PASSWORD:health}
    hikari:
      pool-name: HealthHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      connection-init-sql: SET TIME ZONE 'Asia/Shanghai'
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8

server:
  port: 8080
  shutdown: graceful

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

storage:
  type: ${STORAGE_TYPE:supabase}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket-reports: ${SUPABASE_BUCKET_REPORTS:health-reports}
    bucket-exports: ${SUPABASE_BUCKET_EXPORTS:health-exports}
  local:
    root-dir: ${LOCAL_STORAGE_DIR:./data/storage}

deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  price-input-per-m: ${DEEPSEEK_PRICE_INPUT_PER_M:2.0}
  price-output-per-m: ${DEEPSEEK_PRICE_OUTPUT_PER_M:8.0}
  connect-timeout-seconds: 10
  read-timeout-seconds: 90
  stream-read-timeout-seconds: 180

jwt:
  secret: ${JWT_SECRET:health-assistant-dev-secret-key-change-me-1234567890}
  access-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:120}
  refresh-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}

app:
  ai-daily-limit-per-user: ${AI_DAILY_LIMIT_PER_USER:3}
  registration:
    max-users: ${MAX_USERS:10}
  admin:
    default-password: ${ADMIN_DEFAULT_PASSWORD:admin123456}
  export:
    font-path: ${EXPORT_FONT_PATH:C:/Windows/Fonts/simhei.ttf}
    font-family: ${EXPORT_FONT_FAMILY:SimHei}

logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread] %logger{40} - %msg%n"
  level:
    com.health.assistant: info
